name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifacts: 'release/*.dmg'
          - os: windows-latest
            platform: win
            artifacts: 'release/*.exe'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Çeviri kapsamı
        run: npm run i18n

      - name: Build and package
        run: npx electron-vite build && npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Monaco'nun bundle'ı varsayılan V8 yığınını taşırıyor; macOS
          # runner'da "heap out of memory" ile 134 dönüyordu.
          NODE_OPTIONS: --max-old-space-size=8192
          # Runner'da imzalama kimliği yok; otomatik keşif açık kalırsa
          # electron-builder Keychain'de arayıp hata veriyor. Ad-hoc imza
          # zaten package.json'daki mac.identity: "-" ile atılıyor.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifacts }}
          draft: false
          generate_release_notes: true

      - name: Keep artifacts on manual runs
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: kopru-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
